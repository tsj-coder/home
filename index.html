<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>うちのアプリ</title>
<meta name="apple-mobile-web-app-title" content="うちのアプリ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CFE9F5">
<style>
  :root { --sky: #CFE9F5; --ink: #4A3F35; --muted: #7B6B5C; --accent: #E0603F; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--sky); color: var(--ink);
    font-family: 'Hiragino Maru Gothic ProN', 'M PLUS Rounded 1c', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  img { width: 96px; height: auto; }
  h1 { font-size: 24px; margin: 6px 0 4px; letter-spacing: .06em; }
  .go { color: var(--muted); font-size: 14px; }
  .setup { display: none; text-align: left; }
  .setup section {
    background: #fff; border: 3px solid var(--ink); border-radius: 16px;
    padding: 12px 16px; margin-top: 14px;
  }
  .setup h2 { font-size: 16px; margin: 0 0 6px; }
  .setup ol { margin: 0; padding-left: 1.3em; line-height: 1.8; font-size: 15px; }
  .setup .note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  body.is-setup .setup { display: block; }
  body.is-setup .go { display: none; }
</style>
</head>
<body>
<main>
  <img src="house.webp" alt="">
  <h1>うちのアプリ</h1>
  <p class="go">ひらいています…</p>
  <div class="setup">
    <section>
      <h2>iPhone</h2>
      <ol>
        <li>下の共有ボタンを押す</li>
        <li>「ホーム画面に追加」を押す</li>
        <li>「Webアプリとして開く」を<b>オフ</b>にして「追加」</li>
      </ol>
      <p class="note">オフにすると、いつものSafariで開くので、Googleにログインし直さずに済みます。</p>
    </section>
    <section>
      <h2>Android</h2>
      <ol>
        <li>右上の「︙」を押す</li>
        <li>「ホーム画面に追加」を押す</li>
        <li>「追加」を押す</li>
      </ol>
    </section>
  </div>
</main>
<script>
  (function () {
    var SITE = 'https://sites.google.com/view/uchi-apps-1014/%E3%81%86%E3%81%A1%E3%81%AE%E3%82%A2%E3%83%97%E3%83%AAtop';
    if (/[?&]setup\b/.test(location.search)) {
      // 追加の案内を出し、アドレスを ?setup の無い形にしておく（ホーム画面にはこちらが登録される）
      document.body.className = 'is-setup';
      history.replaceState(null, '', location.pathname);
      return;
    }
    location.replace(SITE);
  })();
</script>
</body>
</html>
